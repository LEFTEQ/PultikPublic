# Generated by `cargo xtask public-lock` from the source repository's workspace: the crates
# Pultík's Rust archive is built from. Do not edit.
[workspace]
resolver = "3"
members = [
    "crates/canvas-draw",
    "crates/canvas-text",
    "crates/canvas-gpu",
    "crates/code-core",
    "crates/code-core-ffi",
    "crates/theme",
    "crates/timeline",
    "crates/canvas-ffi",
    "crates/pultik-ffi",
]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.96"
version = "4.1.0"

[workspace.dependencies]
bytemuck = { features = ["derive"], version = "1.25.2" }
canvas-draw = { path = "crates/canvas-draw" }
canvas-ffi = { path = "crates/canvas-ffi" }
canvas-gpu = { path = "crates/canvas-gpu" }
canvas-text = { path = "crates/canvas-text" }
code-core = { path = "crates/code-core" }
code-core-ffi = { path = "crates/code-core-ffi" }
etagere = "0.3.0"
lyon_tessellation = "1.0.22"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
proptest = "1.12.0"
regex = "1.13.1"
ropey = "1.6.1"
serde = { features = ["derive"], version = "1.0.229" }
serde_json = "1.0.154"
similar = "2.7.0"
theme = { path = "crates/theme" }
thiserror = "2.0.21"
timeline = { path = "crates/timeline" }
tracing = "0.1.44"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
tree-sitter-go = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-javascript = "=0.23.1"
tree-sitter-json = "=0.24.8"
tree-sitter-md = "=0.5.3"
tree-sitter-php = "=0.25.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.0"
unicode-width = "0.2.2"

[profile.dev]
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.package.canvas-draw]
opt-level = 2

[profile.dev.package.canvas-ffi]
opt-level = 2

[profile.dev.package.canvas-gpu]
opt-level = 2

[profile.dev.package.canvas-text]
opt-level = 2

[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.objc2]
debug-assertions = false
opt-level = 2

[profile.dev.package.objc2-foundation]
opt-level = 2

[profile.dev.package.objc2-metal]
opt-level = 2

[profile.dev.package.objc2-quartz-core]
opt-level = 2

[profile.dev.package.timeline]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
debug-assertions = false
opt-level = 2

[profile.dev.package.wgpu-types]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[profile.ffi-release]
inherits = "release"
panic = "unwind"
