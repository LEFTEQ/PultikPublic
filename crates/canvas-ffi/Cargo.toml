[package]
name = "canvas-ffi"
description = "Every Rust-drawn surface Pultík hosts, over one C ABI (include/canvas.h, generated by cbindgen): the shared device, the timeline, the estate map and the diff, for Packages/Canvas; linked through pultik-ffi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
timeline.workspace = true
canvas-draw.workspace = true
canvas-text.workspace = true
canvas-gpu.workspace = true
# The diff: code-core's change set and highlights, coloured by a theme.
code-core.workspace = true
theme.workspace = true
