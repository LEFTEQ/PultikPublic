[package]
name = "code-core-ffi"
description = "code-core's C ABI (include/code_core.h, generated by cbindgen) for Pultík's Packages/CodeCore (workbench W13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# An rlib: Pultík links it inside libpultik_ffi.a (crates/pultik-ffi), with canvas-ffi.
crate-type = ["rlib"]

[dependencies]
code-core.workspace = true

[dev-dependencies]
# The tests name roles by theme::SyntaxRole.
theme.workspace = true
