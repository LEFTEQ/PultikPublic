# include/code_core.h is generated from src/ by `cargo xtask code-core-header`;
# `--check` fails when the committed header differs. Never edit the header by hand.
language = "C"
include_guard = "CODE_CORE_H"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
autogen_warning = "// Generated by cbindgen from crates/code-core-ffi (`cargo xtask code-core-header`). Do not edit."
header = """
// code_core.h — the C ABI of libcode_core_ffi, code-core for Swift hosts (Packages/CodeCore).
//
// Every function returns a CodeCoreStatus (0 is CODE_CORE_OK) and answers through out
// parameters; a panic inside the core is caught and returned as CODE_CORE_PANICKED, never
// unwound into the caller. A failure's message, when the caller passes `error`, is an owned
// NUL-terminated string: free it with code_core_string_free.
//
// Text crosses as UTF-8 (CodeCoreStr: pointer + byte length, never NUL-terminated). Positions
// cross as UTF-16 code units, the unit Swift's NSString and NSRange count: the core speaks
// bytes and converts once, here. Every result a function allocates has its own *_free; a
// CodeCoreStr inside a result borrows from that result and dies with it.
//
// Thread safety: the free functions may run on any thread. A handle (CodeCoreSymbols,
// CodeCoreSymbolBuilder, CodeCoreGrep) is used by one thread at a time; a CodeCoreMatcher is
// immutable and may be shared."""

[export]
prefix = ""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
